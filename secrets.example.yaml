# Copy to secrets.local.yaml (gitignored) and fill in real values.
# See CLAUDE.md "Live sync" section for how to obtain each of these.

google_health:
  client_id: "your-client-id.apps.googleusercontent.com"
  client_secret: "your-client-secret"
  redirect_uri: "http://localhost:8765/callback"
  scopes:
    - "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly"
    - "https://www.googleapis.com/auth/googlehealth.sleep.readonly"
    - "https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly"

postgres:
  # Supabase Project Settings -> Database -> Connection string (URI format).
  connection_string: "postgresql://postgres:[password]@[host]:5432/postgres"
